<div class="p-relative">
  <div class="fbox-row-center gap-8px">
    <span class="answer-tag"
      >{{ this.answerService.getSelectorByNumber(this.answerNumber()) }}.</span
    >
    <input
      #answerInput
      class="input input__answer"
      type="text"
      [value]="answerValue()"
      (input)="answerInputEvent.emit(answerInput.value)"
      [formControl]="answerFormControl"
    />
    <span class="btn-delete" (click)="deleteAnswerEvent.emit()"></span>
  </div>
  @if (answerFormControl.invalid && (answerFormControl.dirty || answerFormControl.touched)) {
    <div class="error error--answer">
      @if (answerFormControl.hasError('required')) {
        <div>Text required.</div>
      }
    </div>
  }
</div>
